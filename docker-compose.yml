services:
  motion-master:
    build: .
    container_name: motion-master
    network_mode: host
    privileged: true
    environment:
      MM_DRV: "${MM_DRV:-soem}"
      MM_MAC: "${MM_MAC}"
      MM_REQ_RES_PORT: "${MM_REQ_RES_PORT:-63524}"
      MM_PUB_SUB_PORT: "${MM_PUB_SUB_PORT:-63525}"
      MM_IPS: "${MM_IPS:-}"
      MM_PDO_MODE: "${MM_PDO_MODE:-monitor}"
    restart: unless-stopped

  motion-master-api:
    image: synapticon/motion-master-api:latest
    container_name: motion-master-api
    network_mode: host
    depends_on:
      - motion-master
    environment:
      PORT: "${MM_API_PORT:-63526}"
    restart: unless-stopped

  oblac-drives:
    image: synapticon/oblac-drives:latest
    container_name: oblac-drives
    depends_on:
      - motion-master
    ports:
      - "${OBLAC_DRIVES_PORT:-63527}:80"
    restart: unless-stopped
